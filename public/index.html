<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>해쨍쨍 서핑 · 강릉 강문 / 태안 만리포</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--ink:#14202e;--panel:rgba(244,248,250,.84);--line:rgba(20,32,46,.18);--buoy:#ffb800;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e8eef2;--panel:rgba(16,26,38,.8);--line:rgba(232,238,242,.2)}}
:root[data-theme="dark"]{--ink:#e8eef2;--panel:rgba(16,26,38,.8);--line:rgba(232,238,242,.2)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:#9ad3f0;overflow:hidden;color:var(--ink);font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
.p{position:fixed;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px}
#top{top:calc(12px + env(safe-area-inset-top,0px));left:12px}
h1{margin:0 0 8px;font:22px/1 'Black Han Sans','Apple SD Gothic Neo',sans-serif;letter-spacing:.02em}
.tabs{display:flex;gap:6px}
.tabs button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.tabs button.on{background:var(--buoy);border-color:var(--buoy);color:#14202e;font-weight:700}
.tabs button:focus-visible,#act:focus-visible,#msg:focus-visible{outline:2px solid var(--buoy);outline-offset:2px}
#gen{margin-top:6px}
#st,#score{margin-top:8px;font-size:13px;opacity:.85}
#help{top:calc(12px + env(safe-area-inset-top,0px));right:12px;max-width:210px;font-size:12px;line-height:1.5}
#chat{left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(320px,62vw)}
#log{max-height:110px;overflow:hidden;font-size:13px;line-height:1.45;margin-bottom:6px}
#log b{margin-right:4px}
#msg{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
#hang{position:fixed;right:14px;bottom:calc(96px + env(safe-area-inset-bottom,0px));width:84px;height:84px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;border-radius:50%;border:0;background:rgba(20,32,46,.75);color:#fff;font:700 15px/1.25 'Gowun Dodum',sans-serif;box-shadow:0 0 0 var(--ring,0px) rgba(58,196,125,.55),0 4px 14px rgba(0,0,0,.3);cursor:pointer;display:none}
#hang.go{background:#3ac47d;color:#08210f}
#hang.ok{background:#ffb800;color:#14202e}
#hang:focus-visible{outline:2px solid #ffb800;outline-offset:3px}
#fight{position:fixed;right:14px;bottom:calc(190px + env(safe-area-inset-bottom,0px));width:76px;height:60px;border-radius:30px;border:0;background:#ff8fb3;color:#3a0f22;font:700 13px/1.2 'Gowun Dodum',sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer;display:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#fight:focus-visible{outline:2px solid #ffb800;outline-offset:2px}
#drop{position:fixed;right:92px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:76px;height:60px;border-radius:30px;border:0;background:#14202e;color:#ffb800;font:700 13px/1.2 'Gowun Dodum',sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer;display:none}
#drop:focus-visible{outline:2px solid #ffb800;outline-offset:2px}
#act{position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:68px;height:68px;border-radius:50%;border:0;background:var(--buoy);color:#14202e;font:700 14px/1.2 'Gowun Dodum',sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
#gauge{right:14px;bottom:calc(190px + env(safe-area-inset-bottom,0px));width:150px;display:none;font-size:12px}
#gauge .tr{position:relative;height:10px;border-radius:5px;background:var(--line);margin-top:6px}
#gauge .zone{position:absolute;top:0;height:100%;left:9.1%;width:19.1%;background:#3ac47d;border-radius:5px}
#gauge .mk{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--ink)}
#toast{position:fixed;left:50%;top:38%;transform:translateX(-50%);padding:8px 16px;border-radius:999px;background:#14202e;color:#fff;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top" class="p">
  <h1>해쨍쨍 서핑</h1>
  <div class="tabs" id="plc"><button data-p="gn" class="on">강릉 강문</button><button data-p="ml">태안 만리포</button></div>
  <div class="tabs" id="gen"><button data-g="m" class="on">남자</button><button data-g="f">여자</button></div>
  <div id="st"></div>
  <div id="score">라이딩 0회 · 최장 0m</div>
</div>
<div id="help" class="p">WASD 또는 왼쪽 터치로 이동<br>드래그로 시점 회전<br>패들로 바다에 나가면 타이밍 게이지가 나타나요<br>초록 구간에 Space로 팝업<br>같은 파도를 노리는 서퍼보다 먼저 F로 드롭<br>(먼저 파도를 잡은 서퍼는 드롭 불가)<br>해변에서 서퍼와 붙으면 G: 투닥투닥<br>50m 이상 타면 행텐: 보드 터치 또는 H</div>
<div id="chat" class="p"><div id="log"></div><input id="msg" placeholder="Enter로 채팅" maxlength="60" autocomplete="off"></div>
<button id="hang">행텐</button>
<button id="fight">투닥<br>(G)</button>
<button id="drop">드롭<br>(F)</button>
<button id="act">패들<br>서핑</button>
<div id="gauge" class="p">파도 타이밍<div class="tr"><div class="zone"></div><div class="mk"></div></div></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), rnd=(a,b)=>a+Math.random()*(b-a);
const cv=$('#c'), R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio||1,2));
const S=new THREE.Scene(), cam=new THREE.PerspectiveCamera(60,1,.1,900);
S.add(new THREE.HemisphereLight(0xcfe8ff,0xc9b48a,.85));
const sun=new THREE.DirectionalLight(0xfff1d0,1.15); sun.position.set(-30,50,-40); S.add(sun);
const place=new THREE.Group(); S.add(place);
const M=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c},o));
const B=(c)=>new THREE.MeshBasicMaterial({color:c});
const sh={cone:new THREE.ConeGeometry(1,1,7),cyl:new THREE.CylinderGeometry(.18,.25,1,6),sph:new THREE.SphereGeometry(1,12,8),box:new THREE.BoxGeometry(1,1,1)};
const mat={pine:M(0x2a5a3a),pine2:M(0x3b7a4a),snow:M(0xffffff),wood:M(0x6b4a33),ink:M(0x1d2a38)};
function add(geo,m,x,y,z,sx,sy,sz,p){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);(p||place).add(o);return o}

/* ---------- 바다 ---------- */
const sg=new THREE.PlaneGeometry(400,300,160,100); sg.rotateX(-Math.PI/2); sg.translate(0,0,-150);
const sp=sg.attributes.position, N=sp.count, sx=new Float32Array(N), sz=new Float32Array(N);
for(let i=0;i<N;i++){sx[i]=sp.getX(i);sz[i]=sp.getZ(i)}
sg.setAttribute('color',new THREE.BufferAttribute(new Float32Array(N*3),3));
const sea=new THREE.Mesh(sg,new THREE.MeshPhongMaterial({color:0xffffff,vertexColors:true,flatShading:true,shininess:90,specular:0xffffff}));
S.add(sea);
const farSea=new THREE.Mesh(new THREE.PlaneGeometry(4000,4000).rotateX(-Math.PI/2),B(0x3a7389)); farSea.position.y=-.3; S.add(farSea);
const land=new THREE.Mesh(new THREE.PlaneGeometry(4000,2000).rotateX(-Math.PI/2),B(0xffffff)); land.position.set(0,.03,1000);
land.material=new THREE.MeshLambertMaterial({color:0xf8fbfc}); S.add(land);
const sand=add(new THREE.PlaneGeometry(500,70).rotateX(-Math.PI/2),M(0xe4e8e9),0,.05,35,1,1,1,S);
const wet=add(new THREE.PlaneGeometry(500,1).rotateX(-Math.PI/2),M(0x9aa7ae),0,.06,2,1,1,1,S);
const foam=add(new THREE.PlaneGeometry(500,1.6).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.6}),0,.12,.4,1,1,1,S);
let AMP=1.4; const base=new THREE.Color();
function H(x,z,t){const d=-z; if(d<0)return 0; const a=AMP*Math.min(1,d/25)*(d<4?d/4:1);
  return a*.5*Math.sin(d*.2+t*1.3+.7*Math.sin(x*.06))+a*.25*Math.sin(d*.45+t*2+x*.1)}
function updSea(t){const col=sg.attributes.color;
  for(let i=0;i<N;i++){const y=H(sx[i],sz[i],t); sp.setY(i,y);
    const k=clamp((y/AMP-.28)*2.2,0,.9);
    col.setXYZ(i,base.r+(1-base.r)*k,base.g+(1-base.g)*k,base.b+(1-base.b)*k)}
  sp.needsUpdate=true; col.needsUpdate=true}

/* ---------- 장소 ---------- */
const P={
 gn:{sky:0x9ad3f0,fog:.0018,sea:0x1b86ad,amp:2.8,sand:0xf1deaa,wc:0xcdb98e,land:0x7fa56a,wet:5,t:'29°C · 맑음 · 파도 2.8m',yaw:.5},
 ml:{sky:0xa6dbf2,fog:.0018,sea:0x2ba0b8,amp:1.6,sand:0xf3e0b5,wc:0xbfae86,land:0x86ad6c,wet:16,t:'27°C · 맑음 · 파도 1.6m · 썰물',yaw:-.5}
};
function pine(x,y,z,s){const g=new THREE.Group();
  add(sh.cyl,mat.wood,0,s,0,1,2*s,1,g);
  for(let i=0;i<3;i++){const r=(2.2-i*.55)*s,h=(2.4-i*.4)*s,yy=(1.6+i*1.4)*s;
    add(sh.cone,mat.pine,0,yy,0,r,h,r,g); add(sh.cone,mat.pine2,0,yy+h*.22,0,r*.8,h*.7,r*.8,g)}
  g.position.set(x,y,z); place.add(g)}
function mtn(x,z,r,h,c){add(sh.cone,M(c||0x4f8a6a),x,h/2,z,r,h,r); add(sh.cone,M(c?0x7a8a8f:0x6aa37c),x,h*.79,z,r*.42,h*.42,r*.42)}
function build(k){
  const p=P[k]; place.clear();
  S.background=new THREE.Color(p.sky); S.fog=new THREE.FogExp2(p.sky,p.fog);
  document.body.style.background='#'+new THREE.Color(p.sky).getHexString();
  AMP=p.amp; wet.material.color.set(p.wc); land.material.color.set(p.land); base.set(p.sea); farSea.material.color.set(p.sea); sand.material.color.set(p.sand);
  wet.scale.z=p.wet; wet.position.z=p.wet/2; $('#st').textContent=p.t;
  for(let i=0;i<26;i++){const x=rnd(-200,200); pine(x,0,rnd(42,70),rnd(1,1.7))}
  if(k==='gn'){
    for(let i=0;i<7;i++) mtn(-420+i*140+rnd(-30,30),rnd(320,380),rnd(80,130),rnd(90,160));
    add(sh.box,M(0xf4efe4),-30,2.5,34,12,5,8); add(sh.box,M(0xe85d3f),-30,5.4,34,13,.8,9);
    const w=add(new THREE.PlaneGeometry(8,2.2),B(0x7fc4e0),-30,2.6,29.98,1,1,1); w.rotation.y=Math.PI;
    for(let i=0;i<5;i++){const x=-20+i*9;
      add(sh.cyl,mat.wood,x,3,14,1,6,1); add(sh.sph,mat.wood,x,6.4,14,.5,.32,.25); add(sh.sph,mat.wood,x-.45,6.7,14,.2,.2,.2)}
  } else {
    mtn(-90,-150,16,17,0x4a5560); mtn(40,-200,12,12,0x4a5560); mtn(150,-170,20,20,0x4a5560);
    add(sh.sph,new THREE.MeshLambertMaterial({color:0x6f9e5a}),-40,0,110,140,22,60);
    for(let i=0;i<60;i++){const x=-40+rnd(-130,130),z=110+rnd(-55,55),u=1-((x+40)/140)**2-((z-110)/60)**2;
      if(u>.05) pine(x,22*Math.sqrt(u)-1,z,rnd(1,1.8))}
    add(sh.box,M(0x8a6a4d),34,2,-20,3,.3,44); add(sh.box,M(0xb08a62),34,2.2,-20,2.9,.12,44);
    for(let i=0;i<11;i++){const z=2-i*4;
      add(sh.box,mat.wood,32.7,.8,z,.3,2.6,.3); add(sh.box,mat.wood,35.3,.8,z,.3,2.6,.3);
      if(i%2===0) add(sh.sph,B(0xffd27a),35.4,3.3,z,.28,.28,.28)}
    const sd=new THREE.Mesh(new THREE.CircleGeometry(40,32),new THREE.MeshBasicMaterial({color:0xfff6c8,fog:false})); sd.position.set(80,38,-520); place.add(sd);
  }
  add(sh.cyl,mat.wood,3,1.5,12,.5,3,.5); add(sh.cone,M(0xffc83d),3,3.3,12,2.4,1,2.4);
  add(sh.box,M(0x2b8fd6),7,.12,13,1.2,.1,2.6);
  pl.x=0;pl.z=14;pl.mode='walk'; yaw=p.yaw;
  document.querySelectorAll('#plc button').forEach(b=>b.classList.toggle('on',b.dataset.p===k));
  curK=k;
}
let curK='gn';

/* ---------- 아바타 ---------- */
let deckGeo;
const boardGeo=(()=>{const s=new THREE.Shape();
  s.moveTo(0,-1.45);
  s.bezierCurveTo(.22,-1.45,.28,-1.1,.31,-.7);
  s.bezierCurveTo(.34,-.1,.34,.4,.31,.85);
  s.bezierCurveTo(.26,1.25,.12,1.45,0,1.45);
  s.bezierCurveTo(-.12,1.45,-.26,1.25,-.31,.85);
  s.bezierCurveTo(-.34,.4,-.34,-.1,-.31,-.7);
  s.bezierCurveTo(-.28,-1.1,-.22,-1.45,0,-1.45);
  const g=new THREE.ExtrudeGeometry(s,{depth:.07,bevelEnabled:true,bevelThickness:.025,bevelSize:.025,bevelSegments:3,curveSegments:16});
  g.rotateX(-Math.PI/2);
  deckGeo=new THREE.ShapeGeometry(s,16); deckGeo.rotateX(-Math.PI/2); deckGeo.scale(.96,1,.98); return g})();
let deckMat;
function deckMaterial(){ if(deckMat)return deckMat;
  const W=256,H=1024,c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  x.fillStyle='#f4b6cb'; x.fillRect(0,0,W,H);
  for(let i=0;i<2600;i++){x.fillStyle=Math.random()<.5?'rgba(255,225,235,.5)':'rgba(214,120,160,.22)';x.fillRect(Math.random()*W,Math.random()*H,rnd(2,6),rnd(2,6))}
  x.strokeStyle='rgba(255,236,228,.85)'; x.lineWidth=4; x.beginPath(); x.moveTo(W/2,0); x.lineTo(W/2,H); x.stroke();
  const star=(cx,cy,r,rot,mot)=>{x.save();x.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5-Math.PI/2,rr=i%2?r*.42:r;x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}x.closePath();
    x.fillStyle=mot?'#aeb4c8':'#23233f';x.fill();
    if(mot){x.clip();for(let i=0;i<70;i++){x.fillStyle=Math.random()<.6?'#2b2b4a':'#eceff6';x.fillRect(cx+rnd(-r,r),cy+rnd(-r,r),rnd(3,9),rnd(3,9))}}
    x.restore()};
  star(.58*W,.11*H,40,.2,false); star(.67*W,.29*H,42,-.1,false);
  star(.26*W,.40*H,40,.3,true); star(.73*W,.54*H,36,-.2,true); star(.33*W,.63*H,40,.1,true); star(.83*W,.73*H,30,.4,false);
  const pad=()=>{x.beginPath();x.moveTo(.1*W,.775*H);x.lineTo(.9*W,.745*H);x.lineTo(.96*W,H);x.lineTo(.04*W,H);x.closePath()};
  x.save(); pad(); x.fillStyle='#14141a'; x.fill(); x.clip();
  x.fillStyle='#2b2b38'; for(let yy=.76*H,r=0;yy<H;yy+=16,r++)for(let xx=(r%2?8:0);xx<W;xx+=16){x.beginPath();x.moveTo(xx,yy-6);x.lineTo(xx+6,yy);x.lineTo(xx,yy+6);x.lineTo(xx-6,yy);x.closePath();x.fill()}
  x.fillStyle='#f2dcd6'; for(let yy=.8*H;yy<.97*H;yy+=22){x.beginPath();x.arc(.2*W,yy,3,0,7);x.fill();x.beginPath();x.arc(.8*W,yy,3,0,7);x.fill()}
  x.restore();
  const t=new THREE.CanvasTexture(c); t.repeat.set(1/.68,1/2.9); t.offset.set(.5,.5); t.anisotropy=4;
  deckMat=new THREE.MeshLambertMaterial({map:t,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}); return deckMat}
function surfer(bc,hc,name,f,hairC,sk){
  const g=new THREE.Group(), rig=new THREE.Group(); g.add(rig);
  const board=add(boardGeo,M(f?0xf2a9c2:0xf4efe4),0,.02,0,1,1,1,g);
  if(f){const dk=new THREE.Mesh(deckGeo,deckMaterial()); dk.position.y=.097; board.add(dk)}
  else{add(sh.box,M(0x8a5a2b),0,.12,0,.035,.012,2.75,board);
    add(sh.box,M(hc),0,.118,-.55,.62,.012,.2,board); add(sh.box,M(hc),0,.118,-.25,.62,.012,.07,board)}
  const fin=add(sh.box,M(0x1d2a38),0,-.17,1.0,.03,.34,.42,board); fin.rotation.x=.45;
  const fem=!!f, skin=M(sk||0xf0c9a6), SP=new THREE.SphereGeometry(1,20,14), hairM=M(hairC||0x3a2a20), cB=M(bc);
  const up=new THREE.Group(); rig.add(up);
  add(SP,skin,-.12,.33,0,.11,.33,.12,rig); add(SP,skin,.12,.33,0,.11,.33,.12,rig);
  add(SP,skin,-.12,.07,-.04,.12,.08,.18,rig); add(SP,skin,.12,.07,-.04,.12,.08,.18,rig);
  const mkArm=s=>{const ag=new THREE.Group(); ag.position.set(s*.33,1,0); up.add(ag);
    const m=add(SP,skin,s*.02,-.17,0,.075,.27,.075,ag); m.rotation.z=s*.6;
    add(SP,skin,s*.18,-.41,0,.065,.065,.065,ag); return ag};
  const armL=mkArm(-1), armR=mkArm(1);
  if(!fem){
    add(SP,skin,0,.84,0,.31,.42,.26,up);
    add(SP,cB,0,.55,0,.315,.19,.27,rig); add(SP,cB,-.12,.4,0,.135,.22,.14,rig); add(SP,cB,.12,.4,0,.135,.22,.14,rig);
    add(SP,M(hc),0,.69,0,.32,.045,.275,up);
    add(SP,M(hc),0,1.1,-.02,.17,.02,.15,up); add(SP,M(0xffffff),0,1.0,-.2,.045,.055,.03,up);
  } else {
    add(SP,skin,0,.84,0,.27,.42,.23,up); add(SP,skin,0,.55,0,.31,.19,.25,rig);
    add(SP,cB,0,.53,0,.32,.11,.26,rig);
    add(SP,cB,-.1,.97,-.165,.1,.085,.08,up); add(SP,cB,.1,.97,-.165,.1,.085,.08,up);
    add(SP,cB,0,.95,0,.285,.04,.24,up); add(SP,cB,0,1.12,0,.15,.012,.13,up);
  }
  add(SP,skin,0,1.35,0,.34,.32,.33,up);
  if(!fem){
    add(SP,M(hc),-.12,1.33,-.295,.115,.1,.03,up); add(SP,M(hc),.12,1.33,-.295,.115,.1,.03,up);
    add(SP,M(0x0d1117),-.12,1.33,-.305,.09,.075,.035,up); add(SP,M(0x0d1117),.12,1.33,-.305,.09,.075,.035,up);
    add(SP,M(hc),0,1.34,-.3,.12,.015,.025,up);
  } else {const EW=M(0xffffff),EK=M(0x1a1a24);
    for(const e of [-1,1]){add(SP,EW,e*.12,1.31,-.295,.065,.075,.04,up); add(SP,EK,e*.12,1.31,-.318,.04,.052,.03,up);
      add(SP,EW,e*.12+.014,1.33,-.346,.013,.013,.01,up); const br=add(SP,hairM,e*.12,1.43,-.285,.075,.012,.03,up); br.rotation.z=e*.12}
  }

    try { socket = new WebSocket(endpoint()); }
    catch(e){ scheduleReconnect(); return; }
    socket.addEventListener('open',()=>{ retryDelay=1000; try{socket.send(JSON.stringify({type:'join'}))}catch(e){} });
    socket.addEventListener('message',ev=>{
      let msg; try{msg=JSON.parse(ev.data)}catch(e){return}
      if(msg.type==='welcome'){
        peerId=String(msg.id||''); roomName=String(msg.room||''); connected=true; peers.clear();
        (Array.isArray(msg.peers)?msg.peers:[]).forEach(p=>{if(p&&p.id&&p.id!==peerId)peers.set(String(p.id),p.presence||{})});
        if(lastPresence) send({type:'presence',data:lastPresence});
        notifyPeers();
        return;
      }
      if(msg.type==='peer_joined' && msg.id){ if(msg.id!==peerId)peers.set(String(msg.id),msg.presence||{}); notifyPeers(); return; }
      if(msg.type==='peer_left' && msg.id){ peers.delete(String(msg.id)); notifyPeers(); return; }
      if(msg.type==='presence' && msg.id){ if(msg.id!==peerId){peers.set(String(msg.id),msg.data||{});notifyPeers()} return; }
      if(msg.type==='event' && typeof msg.event==='string'){
        const callbacks=eventCallbacks.get(msg.event)||[];
        callbacks.forEach(fn=>{try{fn({peer:String(msg.peer||''),data:msg.data||{},isMe:String(msg.peer||'')===peerId})}catch(e){console.error(e)}});
      }
      if(msg.type==='error' && msg.message) console.warn('[SURF WORLD 멀티플레이]',msg.message);
    });
    socket.addEventListener('close',()=>{
      connected=false; peerId=null; roomName=''; peers.clear(); notifyPeers(); scheduleReconnect();
    });
    socket.addEventListener('error',()=>{try{socket.close()}catch(e){}});
  }
  function scheduleReconnect(){
    clearTimeout(retryTimer); retryTimer=setTimeout(connect,retryDelay);
    retryDelay=Math.min(10000,retryDelay*2);
  }
  room={
    onPeers(fn){ if(typeof fn==='function'){peerCallbacks.push(fn);notifyPeers()} },
    on(event,fn){ if(!eventCallbacks.has(event))eventCallbacks.set(event,[]);eventCallbacks.get(event).push(fn) },
    emit(event,data){ send({type:'event',event,data}) },
    presence(data){ lastPresence=data; send({type:'presence',data}); return Promise.resolve() }
  };
  connect();
})();
function sendPresence(t){if(!room||t-lastPres<.08)return; lastPres=t;
  room.presence({x:+pl.x.toFixed(2),z:+pl.z.toFixed(2),m:pl.mode[0],h:+me.g.rotation.y.toFixed(2),g:myF?1:0,c:swi,k:hang.armed?hang.stage:0}).catch(()=>{})}
function tick(){
  const dt=Math.min(clock.getDelta(),.05), t=Date.now()/1000;
  const up=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-jz, rt=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+jx;
  if(keys.KeyQ)yaw+=dt*1.6; if(keys.KeyE)yaw-=dt*1.6;
  const sy=Math.sin(yaw),cy=Math.cos(yaw);
  let dx=-sy*up+cy*rt, dz=-cy*up-sy*rt; const len=Math.hypot(dx,dz); if(len>1){dx/=len;dz/=len}
  if(t<fight.until){if(len>.5&&t>fight.t0+.6){fight.until=0;me.fight=0;toast('투닥 끝!')}else{dx=0;dz=0}}
  const moving=len>.1&&!(t<fight.until);
  if(pl.mode==='walk'){pl.x+=dx*5*dt;pl.z+=dz*5*dt; if(pl.z<0)pl.mode='paddle'}
  else if(pl.mode==='paddle'){pl.x+=dx*3.2*dt;pl.z+=dz*3.2*dt; if(pl.z>1)pl.mode='walk'}
  else{pl.z+=6.5*dt;pl.x+=cy*rt*7*dt;
    if(pl.z>-2){const d=Math.round(pl.z-pl.start);pl.rides++;pl.best=Math.max(pl.best,d);pl.mode='paddle';pl.z=-1.5;toast('라이딩 '+d+'m 성공!'+(hang.stage===2?' 행텐 보너스!':''));
      updScore()}}
  pl.x=clamp(pl.x,-190,190);pl.z=clamp(pl.z,-250,110);
  const y=pl.mode==='walk'?.05:H(pl.x,pl.z,t)+(pl.mode==='surf'?.16:.12);
  me.g.position.set(pl.x,y,pl.z); pose(me,pl.mode,t,moving,hang.armed?hang.stage:0);
  if(pl.mode==='surf'){face(me,cy*rt*7,6.5);me.g.rotation.z=rt*.3}
  else{me.g.rotation.z=0;if(moving)face(me,dx,dz)}
  if(me.say>0){me.say-=dt;if(me.say<=0)drawLab(me,null)}
  npcs.forEach(a=>updNPC(a,dt,t)); hangTick(t); updRemotes(dt,t); updFight(dt,t); sendPresence(t);
  {const db=$('#drop'); db.style.display='block'; db.style.opacity=dropTarget(t)?1:.55}
  if(pl.cd>0)pl.cd-=dt;
  const gOn=pl.mode==='paddle'&&pl.z<-8; gz.style.display=gOn?'block':'none';
  if(gOn)gm.style.left=((psi(pl.x,-pl.z,t)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)/(2*Math.PI)*100)+'%';
  updSea(t); foam.material.opacity=.45+.3*Math.sin(t*1.3);
  tgt.lerp(new THREE.Vector3(pl.x,y+1.3,pl.z),1-Math.exp(-6*dt));
  const D=pl.mode==='surf'?9:11;
  cam.position.set(tgt.x+sy*D*Math.cos(pitch),Math.max(tgt.y+D*Math.sin(pitch),H(tgt.x,tgt.z,t)+1.5),tgt.z+cy*D*Math.cos(pitch));
  cam.lookAt(tgt);
  R.render(S,cam); requestAnimationFrame(tick)}
resize(); build('gn'); tgt.set(0,1,14);
document.querySelectorAll('#gen button').forEach(b=>b.onclick=()=>{setGender(b.dataset.g==='f');try{localStorage.setItem('ss-g',b.dataset.g)}catch(e){}});
let g0='m';try{g0=localStorage.getItem('ss-g')||'m'}catch(e){}
if(g0==='f')setGender(true,true);
logLine('안내','강문 해변에 햇살이 쨍쨍해요. 바다로 걸어 들어가 보세요.');
tick();
</script>
