$('#help').innerHTML='<b>이동</b>PC: WASD 또는 방향키 · 모바일: 화면을 누른 채 가고 싶은 방향으로 손가락을 밀기<b>바다 들어가기</b>보드를 들고 해변을 걷다가 물에 들어가면 자동으로 보드에 엎드려 패들링합니다. 앞(W)으로 저어 큰 파도 쪽으로 나가 보세요.<b>라이딩</b>파도의 가파른 앞면이 솟아오를 때 라이딩 버튼(R)을 누르면 팝업해서 파도를 타요. 타이밍을 놓치면 못 타요! 버튼이 반짝이면 잡을 수 있는 순간이에요. 라이딩 중: A/D 좌우 · W/S 파도 위/아래 (너무 올라가거나 내려가면 와이프아웃) · 버튼을 다시 누르면 내리기<b>에어 (숏보드 전용)</b>W로 파도 탑까지 올라가면 에어 버튼(Space)이 반짝여요. 누르면 공중으로 솟아 한 바퀴! 공중에서 빨간 바늘이 초록 구간에 왔을 때 한 번 더 누르면 착지 성공. 못 맞추면 와이프아웃.<b>채팅</b>아래 채팅 버튼으로 켜고 꺼요. PC는 Enter로 열고 Esc로 닫아요. 보낸 말은 내 머리 위 말풍선으로도 떠요.<b>투닥 (T)</b>해변에서 다른 유저와 가까이 서로 마주보면 투닥 버튼이 반짝여요. 누르면 퍽! 3대 맞으면 KO로 잠깐 기절해요 💫 (6초 안 맞으면 하트 회복)<b>손 흔들기</b>E 키 또는 버튼<b>드롭 (Q)</b>바다에서 파도 더 위쪽에 있는 사람이 아래·뒤쪽 옆 사람(3.5m 안)을 밀 수 있어요. 밀린 사람은 파도를 놓쳐요. 드롭할 수 있을 때 버튼이 반짝여요 (3초 쿨다운)<b>빅웨이브 주의</b>가끔 엄청 큰 파도가 와요. 경고가 뜨면 패들 중에 "지금!" 표시가 나올 때 숏보드는 덕다이빙, 롱보드는 터틀롤(C)을 눌러요. 덕다이빙은 바닷속으로 들어가 파도 밑을 지나가고, 터틀롤은 보드를 뒤집어 매달려 파도를 흘려보내요. 못 하면 해변까지 밀려나요!<b>낮 · 밤 서핑</b>내 기기 시간에 맞춰 바뀌어요. 저녁 6~7시쯤 노을, 밤에는 별과 은하수, 별똥별, 달빛이 비치는 바다. 새벽 5~6시쯤 해가 떠요.<b>바다멍</b>바다멍 버튼(F)을 누르면 보드에 걸터앉아 쉬면서 라이딩하는 다른 서퍼를 따라가며 구경해요. 여러 명이면 8초마다 바뀌고, 움직이면 끝나요.<b>바다거북</b>가끔 바다거북이 수면 가까이 헤엄쳐요. 옆으로 가까이 가면 하트가 뿅뿅 나와요 💕<b>돌고래 주의</b>가끔 돌고래 무리가 뛰어올라요. 부딪히면 넘어지고 3초 동안 파도를 못 타요!<b>행텐 (롱보드 전용)</b>10초 이상 라이딩하면 행텐 버튼(H)이 반짝여요. 누르면 타이밍 바가 나오고, 빨간 바늘이 초록 구간에 왔을 때 누를 때마다 노즈 쪽으로 한 걸음! 4걸음이면 성공. 걸음마다 구간이 좁아지고 빨라져요. 두 번 놓치면 넘어져요.';

f.type='lowpass';f.frequency.setValueAtTime(3400,t);f.frequency.exponentialRampToValueAtTime(650,t+.35);o.connect(f);o2.connect(g2);g2.connect(f);f.connect(g);g.connect(AU.mus);env(g,t,v,.005,dur);[o,o2].forEach(x=>{x.start(t);x.stop(t+dur+.05)})}
function flute(t,m,dur,v){const c=AU.ctx,o=c.createOscillator(),o3=c.createOscillator(),l=c.createOscillator(),lg=c.createGain(),g=c.createGain(),g3=c.createGain();o.type='sine';o3.type='triangle';o.frequency.value=o3.frequency.value=fq(m);
l.frequency.value=5.4;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(fq(m)*.007,t+Math.min(.3,dur*.6));l.connect(lg);lg.connect(o.frequency);lg.connect(o3.frequency);g3.gain.value=.25;o3.connect(g3);g3.connect(g);o.connect(g);g.connect(AU.mus);
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.05);g.gain.linearRampToValueAtTime(v*.8,t+dur*.75);g.gain.linearRampToValueAtTime(0,t+dur);[o,o3,l].forEach(x=>{x.start(t);x.stop(t+dur+.05)})}
function drum(t,f0,f1,dur,v){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur*.6);o.connect(g);g.connect(AU.mus);env(g,t,v,.003,dur);o.start(t);o.stop(t+dur+.05)}
function tok(t,f,v){const c=AU.ctx,o=c.createOscillator(),b=c.createBiquadFilter(),g=c.createGain();o.type='triangle';o.frequency.value=f;b.type='bandpass';b.frequency.value=f;b.Q.value=3;o.connect(b);b.connect(g);g.connect(AU.mus);env(g,t,v,.002,.09);o.start(t);o.stop(t+.12)}
function noiseHit(t,type,f,q,v,dur,out){const c=AU.ctx,s=c.createBufferSource(),b=c.createBiquadFilter(),g=c.createGain();s.buffer=AU.nb;b.type=type;b.frequency.value=f;b.Q.value=q;s.connect(b);b.connect(g);g.connect(out);env(g,t,v,.004,dur);s.start(t,Math.random()*2);s.stop(t+dur+.05)}
function playStep(s,t){const bar=s>>3,i=s&7,ch=PROG[bar],nt=CH[ch];
if([0,2,3,5,6,7].includes(i)){const up=[3,5,7].includes(i),ns=up?[...nt].reverse():nt;ns.forEach((m,k)=>pluck(t+k*.013,m,up?.05:.075,.7))}
if(i==0||i==3)pluck(t,BS[ch],.16,.55);if(i==6)pluck(t,BS[ch]+7,.12,.4);
if(i==0||i==3||i==6)drum(t,150,52,.38,i?.4:.55);if(i==2||i==7)tok(t,880,.1);if(i==4&&bar%2)tok(t,660,.1);
noiseHit(t,'highpass',6000,.7,i%2?.05:.025,.06,AU.mus);
if(AU.loop>0&&MS[s]){const[m,d]=MS[s];if(AU.loop%2)flute(t,m,d*.3+.05,.13);else pluck(t,m+12,.09,d*.3+.3)}}
function swell(t){const a=.5+Math.random()*.4,L=AU.low.gain,F=AU.foam.gain;L.setTargetAtTime(a*.85,t,.9);L.setTargetAtTime(.16,t+2.4,1.3);F.setTargetAtTime(a*.33,t+1.9,.22);F.setTargetAtTime(.035,t+2.6,1.1)}
function gull(t){const c=AU.ctx,n=2+(Math.random()*2|0);for(let k=0;k<n;k++){const s=t+k*.32,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(1500,s);o.frequency.exponentialRampToValueAtTime(950,s+.22);o.connect(g);g.connect(AU.amb);env(g,s,.035,.02,.26);o.start(s);o.stop(s+.3)}}
function squeak(v){if(!AU.ctx)return;const c=AU.ctx,t=c.currentTime;for(let k=0;k<3;k++){const s=t+k*.11,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(2300,s);o.frequency.linearRampToValueAtTime(3300,s+.05);o.frequency.linearRampToValueAtTime(2600,s+.09);o.connect(g);g.connect(AU.sfx);env(g,s,.05*v,.01,.1);o.start(s);o.stop(s+.12)}}
function splash(v){if(!AU.ctx)return;const t=AU.ctx.currentTime;noiseHit(t,'bandpass',1300,.5,v*.5,.7,AU.sfx);noiseHit(t,'lowpass',500,.7,v*.6,.5,AU.sfx)}
function sndLabel(){$('#bs').textContent=AU.on?'소리 켬':'소리 끔'}
$('#bs').onclick=()=>{AU.on=!AU.on;try{localStorage.setItem('sw_snd',AU.on?'1':'0')}catch(e){}auInit();if(AU.master)AU.master.gain.setTargetAtTime(AU.on?1:0,AU.ctx.currentTime,.1);sndLabel()};sndLabel();
function sndStep(){if(!AU.ctx||!me)return;if(water!==AU.pw){if(AU.pw!==undefined&&water)splash(.5);AU.pw=water}
const tg=water?1:cl(1.15-Math.abs(me.z-SH)/60,.35,1);if(Math.abs(tg-AU.ag)>.03){AU.ag=tg;AU.amb.gain.setTargetAtTime(tg,AU.ctx.currentTime,.5)}}
$('#go').onclick=()=>{auInit();start()};

function reChar(p,g,sd,b,name,cz){const n=mkChar(g,sd,b,name,cz),skip=['root','rig','head','aL','aR','lL','lR','bd','L'];for(const k in p)if(!skip.includes(k))n[k]=p[k];
n.root.position.copy(p.root.position);n.root.rotation.copy(p.root.rotation);S.remove(p.root);return n}
function czMark(){document.querySelectorAll('.czp [data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k=='B'?B==(+b.dataset.i?'s':'l'):CZ[b.dataset.k]==+b.dataset.i));document.querySelectorAll('.czp .bt i').forEach(i=>i.style.backgroundColor=BCOL[CZ.bc][1])}
function czShow(v){czOpen=v;$('#cz').style.display=v=='cz'?'block':'none';$('#bz').style.display=v=='bz'?'block':'none';if(me)$('#act').style.display=v?'none':'flex'}
(function(){const panel=(id,title,secs)=>{let h=`<h3>${title}<button class="op czx">닫기</button></h3>`;
secs.forEach(([t,k,items,kind])=>{h+=`<div class="lb">${t}</div><div class="opts">`+items.map((it,i)=>kind=='sw'?`<button class="sw" data-k="${k}" data-i="${i}" title="${it[0]}" aria-label="${it[0]}" style="background:${typeof it[1]=='string'?it[1]:`linear-gradient(135deg,${it[1][0]} 55%,${it[1][1]} 55%)`}"></button>`
:kind=='bt'?`<button class="bt" data-k="${k}" data-i="${i}"><i style="background-image:url(${decal(i,3.1,.78).toDataURL()})"></i><span>${it}</span></button>`:`<button class="op" data-k="${k}" data-i="${i}">${it}</button>`).join('')+'</div>'});
const el=$('#'+id);el.innerHTML=h;el.querySelector('.czx').onclick=()=>czShow(0);
el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k=='B'){setBoard(+b.dataset.i?'s':'l');return}CZ[k]=+b.dataset.i;if(k=='s')czT=1;if(k=='bc'||k=='bp')bzT=1;czMark();saveProf();if(me)me=reChar(me,me.g,me.sd,me.b,me.name,CZ)})};
panel('cz','캐릭터 꾸미기',[['수영복 색','c',SC,'sw'],['머리 색','h',HC,'sw'],['머리 모양','s',HS],['머리 장식','a',AC]]);
panel('bz','보드 꾸미기',[['보드 종류','B',['롱보드 · 행텐','숏보드 · 에어']],['보드 색','bc',BCOL,'sw'],['보드 무늬','bp',BPAT,'bt']]);czMark()})();
/* ---------- 내 설정 기억하기 (이 브라우저에 저장) ---------- */
let PDB=null,pT=0,pBusy=0,pAgain=0;
function profObj(){return{n:$('#nick').value.trim().slice(0,8),g:G,b:B,cz:czS(CZ),sd:SD}}
function saveProf(){const o=profObj();try{localStorage.setItem('sw_prof',JSON.stringify(o))}catch(e){}
if(PDB){clearTimeout(pT);pT=setTimeout(pushProf,700)}}
async function pushProf(){if(!PDB)return;if(pBusy){pAgain=1;return}pBusy=1;try{await PDB.set(profObj());svMsg(1)}catch(e){svMsg(0)}pBusy=0;if(pAgain){pAgain=0;pushProf()}}
function applyProf(s){if(!s||typeof s!='object')return;
if(s.n&&!me)$('#nick').value=String(s.n).slice(0,8);
if(!me&&(s.g=='f'||s.g=='m')){G=s.g;sel('[data-g]',document.querySelector(`[data-g="${G}"]`))}
if(!me&&(s.b=='l'||s.b=='s')){B=s.b;sel('[data-b]',document.querySelector(`[data-b="${B}"]`));hint()}
const c=czP(s.cz,G);if(c){CZ=c;czT=bzT=1;czMark();if(me)me=reChar(me,me.g,me.sd,me.b,me.name,CZ)}if(!me&&Number.isInteger(s.sd))SD=s.sd&255}
function svMsg(cloud){$('#sv').textContent=cloud?'내 계정에 저장돼요 · 폰이든 PC든 그대로 유지':'이 기기에만 저장돼요'}
try{applyProf(JSON.parse(localStorage.getItem('sw_prof')||'null'))}catch(e){}svMsg(0);
(async()=>{try{if(!window.claude||!claude.use)return;const[u,db]=await Promise.all([claude.use('user'),claude.use('db')]);if(!u||!db)return;
const uid=await u.id();if(!uid)return;const ref=db.doc('data/users/'+uid+'/profile');
const snap=await Promise.race([ref.get(),new Promise((_,r)=>setTimeout(()=>r(0),10000))]);PDB=ref;
if(snap.exists)applyProf(snap.data());else pushProf();saveProf();svMsg(1)}catch(e){}})();
$('#nick').addEventListener('change',saveProf);
function setBoard(v){if(v==B&&(!me||me.b==v))return;if(me&&me.on){toast('라이딩 중엔 보드를 바꿀 수 없어요');return}
B=v;sel('[data-b]',document.querySelector(`[data-b="${v}"]`));hint();czMark();saveProf();
if(me){me.b=v;me=reChar(me,me.g,me.sd,v,me.name,CZ);toast(v=='l'?'롱보드로 바꿨어요 · 행텐 도전 가능':'숏보드로 바꿨어요 · 에어 도전 가능')}}
const tg=v=>()=>czShow(czOpen==v?0:v);$('#bc').onclick=$('#czo').onclick=tg('cz');$('#bb').onclick=$('#bzo').onclick=tg('bz');
C.position.set(0,6,75);
let lt=performance.now();
(function f(n){requestAnimationFrame(f);const dt=Math.min(.05,(n-lt)/1e3),t=T();lt=n;updWater(t);nightStep(dt,t);
if(me)step(dt,t);else{C.position.x=Math.sin(n/6000)*10;C.lookAt(0,4,-30)}
for(const p of rem.values())updRem(p,dt,t);dolphins(t,dt);turtles(dt,t);heartStep(dt);popStep(dt);upSpray(dt);R.render(S,C)})(lt);
