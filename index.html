$('#help').innerHTML='<b>이동</b>PC: WASD 또는 방향키 · 모바일: 화면을 누른 채 가고 싶은 방향으로 손가락을 밀기<b>바다 들어가기</b>보드를 들고 해변을 걷다가 물에 들어가면 자동으로 보드에 엎드려 패들링합니다. 앞(W)으로 저어 큰 파도 쪽으로 나가 보세요.<b>라이딩</b>파도의 가파른 앞면이 솟아오를 때 라이딩 버튼(R)을 누르면 팝업해서 파도를 타요. 타이밍을 놓치면 못 타요! 버튼이 반짝이면 잡을 수 있는 순간이에요. 라이딩 중: A/D 좌우 · W/S 파도 위/아래 (너무 올라가거나 내려가면 와이프아웃) · 버튼을 다시 누르면 내리기<b>에어 (숏보드 전용)</b>W로 파도 탑까지 올라가면 에어 버튼(Space)이 반짝여요. 누르면 공중으로 솟아 한 바퀴! 공중에서 빨간 바늘이 초록 구간에 왔을 때 한 번 더 누르면 착지 성공. 못 맞추면 와이프아웃.<b>시점 (V)</b>아래 시점 버튼으로 1인칭(내 눈으로 보기)과 3인칭(뒤에서 나를 보기)을 바꿔요. 고른 시점은 기억돼요.<b>채팅</b>아래 채팅 버튼으로 켜고 꺼요. PC는 Enter로 열고 Esc로 닫아요. 보낸 말은 내 머리 위 말풍선으로도 떠요.<b>투닥 (T)</b>해변에서 다른 유저와 가까이 서로 마주보면 투닥 버튼이 반짝여요. 누르면 퍽! 3대 맞으면 KO로 잠깐 기절해요 💫 (6초 안 맞으면 하트 회복)<b>인사</b>오른쪽 인사 버튼을 누르면 손 흔들기 · 샤카 · 사랑해 · 우우 · 메롱 · 어쩌라고 중에 골라요. 캐릭터가 동작하고 머리 위에 말풍선이 떠요. PC: 숫자 1~6 (E는 손 흔들기)<b>드롭 (Q)</b>바다에서 파도 더 위쪽에 있는 사람이 아래·뒤쪽 옆 사람(3.5m 안)을 밀 수 있어요. 밀린 사람은 파도를 놓쳐요. 드롭할 수 있을 때 버튼이 반짝여요 (3초 쿨다운)<b>빅웨이브 주의</b>가끔 엄청 큰 파도가 와요. 경고가 뜨면 패들 중에 "지금!" 표시가 나올 때 숏보드는 덕다이빙, 롱보드는 터틀롤(C)을 눌러요. 덕다이빙은 바닷속으로 들어가 파도 밑을 지나가고, 터틀롤은 보드를 뒤집어 매달려 파도를 흘려보내요. 못 하면 해변까지 밀려나요!<b>낮 · 밤 서핑</b>내 기기 시간에 맞춰 바뀌어요. 저녁 6~7시쯤 노을, 밤에는 별과 은하수, 별똥별, 달빛이 비치는 바다. 새벽 5~6시쯤 해가 떠요.<b>리쉬 🪢</b>발목과 보드가 분홍 리쉬 줄로 연결돼 있어요. 큰 파도에 휩쓸리거나 ⛈ 폭풍 데이에 넘어지면 리쉬가 끊어져 보드를 잃고 해변으로 밀려나요. 리쉬 없이는 바다에 못 들어가요. 해변에 떨어진 🪢 리쉬나 시작 지점 근처 "리쉬 보관함"에 가면 새 리쉬를 달고 보드를 되찾아요.<b>바다멍</b>바다멍 버튼(F)을 누르면 보드에 걸터앉아 쉬면서 라이딩하는 다른 서퍼를 따라가며 구경해요. 여러 명이면 8초마다 바뀌고, 움직이면 끝나요.<b>레벨 · 랭킹</b>파도 타기(초당 1), 행텐·에어(+20), 덕다이빙·터틀롤(+5), 조개(+3), 파티 웨이브(+10)로 경험치가 쌓여 이름표에 🌊레벨이 붙어요. 왼쪽 위 접속자 표시를 누르면 사람 목록·옆으로 가기·랭킹이 나와요. 해변 전광판에도 랭킹이 떠요.<b>조개 줍기</b>해변에 반짝이는 조개가 가끔 생겨요. 5개: 보드 무늬 진주, 10개: 보드 색 골드, 20개: 진주 왕관이 열려요.<b>모닥불</b>밤에는 해변 뒤쪽 모닥불이 켜져요. 곁에 가면 따뜻한 불꽃과 장작 소리가 나요.<b>날씨</b>10분마다 날씨가 바뀌어요. 비가 오거나 ⛈ 폭풍 데이엔 파도가 커지고 천둥이 쳐요.<b>해파리</b>바다에 해파리 무리가 떠다녀요. 닿으면 찌릿! 잠깐 느려져요.<b>파티 웨이브</b>다른 서퍼와 나란히 2초 이상 같이 타면 보너스! 왼쪽 위 접속자 표시 → 친구 옆 "따라다니기"를 누르면 자동으로 따라붙고, 친구가 파도를 잡으면 같이 올라타서 쉽게 파티 웨이브를 할 수 있어요. 직접 움직이면 따라다니기가 끝나요.<b>바다거북</b>가끔 바다거북이 수면 가까이 헤엄쳐요. 옆으로 가까이 가면 하트가 뿅뿅 나와요 💕<b>돌고래 주의</b>가끔 돌고래 무리가 뛰어올라요. 부딪히면 넘어지고 3초 동안 파도를 못 타요!<b>행텐 (롱보드 전용)</b>10초 이상 라이딩하면 행텐 버튼(H)이 반짝여요. 누르면 타이밍 바가 나오고, 빨간 바늘이 초록 구간에 왔을 때 누를 때마다 노즈 쪽으로 한 걸음! 4걸음이면 성공. 걸음마다 구간이 좁아지고 빨라져요. 두 번 놓치면 넘어져요.';
